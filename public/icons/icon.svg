<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Navy Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="45%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>

    <!-- 24K Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Emerald Market Bull Profit Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Institutional Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Frame -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="992" height="992" rx="208" fill="none" stroke="#1e293b" stroke-width="8" opacity="0.8" />
  <rect x="36" y="36" width="952" height="952" rx="192" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.4" />

  <!-- Background Financial Grid & Compass Ring -->
  <circle cx="512" cy="460" r="320" fill="none" stroke="#1e293b" stroke-width="3" stroke-dasharray="14 14" opacity="0.6" />
  <circle cx="512" cy="460" r="230" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.25" />

  <!-- 3 Ascending Investment Growth Bars (Candlestick Volume Pillars) -->
  <g opacity="0.35">
    <!-- Bar 1 -->
    <rect x="250" y="440" width="38" height="190" rx="10" fill="url(#greenGrad)" />
    <line x1="269" y1="410" x2="269" y2="650" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

    <!-- Bar 2 -->
    <rect x="340" y="360" width="38" height="270" rx="10" fill="url(#greenGrad)" />
    <line x1="359" y1="330" x2="359" y2="650" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

    <!-- Bar 3 (Highest) -->
    <rect x="736" y="240" width="38" height="390" rx="10" fill="url(#greenGrad)" />
    <line x1="755" y1="200" x2="755" y2="650" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Trendline Breakout Arc -->
  <path d="M 210 600 C 340 610, 430 490, 560 410 C 670 340, 750 240, 830 160" 
        fill="none" stroke="url(#greenGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6" />

  <!-- Central "SIGMA" Investment Symbol (Σ) + Breakout Momentum Vector -->
  <g filter="url(#goldGlow)">
    <!-- Primary Σ (Sigma) Monogram -->
    <path d="M 720 220 
             L 330 220 
             L 530 450 
             L 330 680 
             L 720 680" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="70" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Golden Horizontal Caps -->
    <circle cx="720" cy="220" r="16" fill="#fef08a" />
    <circle cx="720" cy="680" r="16" fill="#fef08a" />
  </g>

  <!-- Dynamic Upward Alpha Rocketing Arrow cutting through center -->
  <g filter="url(#greenGlow)">
    <path d="M 430 570 L 730 210" 
          fill="none" 
          stroke="url(#greenGrad)" 
          stroke-width="32" 
          stroke-linecap="round" />

    <!-- Sharp Arrowhead pointing North-East -->
    <polygon points="730,170 730,280 620,200" fill="url(#greenGrad)" />
    <circle cx="760" cy="160" r="24" fill="#34d399" />
    <circle cx="760" cy="160" r="42" fill="none" stroke="#34d399" stroke-width="5" opacity="0.6" />
  </g>

  <!-- Typography: SIGMAPRO (NO BHARAT) -->
  <!-- Brand Badge Container -->
  <rect x="232" y="780" width="560" height="120" rx="36" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4" />

  <!-- "SIGMAPRO" Text -->
  <text x="512" y="855" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="62" 
        font-weight="900" 
        text-anchor="middle" 
        letter-spacing="6">
    <tspan fill="#ffffff">SIGMA</tspan><tspan fill="url(#goldGrad)">PRO</tspan>
  </text>

  <!-- Investing Subtitle -->
  <text x="512" y="888" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="19" 
        font-weight="700" 
        fill="#10b981" 
        text-anchor="middle" 
        letter-spacing="10">INVESTING &amp; TRADING</text>
</svg>