
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#151b28" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />
  
  <!-- Subtle circular grid glow -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.2" />

  <!-- Trending Bullish Upward Wave behind -->
  <path d="M 96 360 C 180 370, 220 300, 290 260 C 340 230, 380 180, 416 130" 
        fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round" opacity="0.7" />
  
  <!-- Stylized Sigma ("Σ") Symbol + Arrow Combination -->
  <g filter="url(#glow)">
    <!-- Main Sigma Path -->
    <path d="M 370 145 
             L 170 145 
             L 275 256 
             L 170 367 
             L 370 367" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Trend Arrow Ascending Through Sigma -->
    <path d="M 230 330 L 370 145" 
          fill="none" 
          stroke="url(#blueGrad)" 
          stroke-width="16" 
          stroke-linecap="round" />
    
    <!-- Arrow Head pointing NE -->
    <polygon points="370,120 370,175 320,135" fill="url(#greenGrad)" />
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="390" cy="115" r="16" fill="#10b981" />
  <circle cx="390" cy="115" r="26" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />

  <!-- BHARAT Tag at Bottom -->
  <rect x="176" y="415" width="160" height="34" rx="17" fill="#151b28" stroke="#f59e0b" stroke-width="2" />
  <text x="256" y="438" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="4">BHARAT</text>
</svg>
