name: Build Android App (APK and AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Signing Key
        run: |
          keytool -genkey -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass sigmapro123 -keypass sigmapro123 \
            -dname "CN=SIGMAPRO, OU=Trading, O=SIGMAPRO, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Generate and Build Android Project
        run: |
          # Initialize Android project from twa-manifest.json
          bubblewrap build --skipSigning || true
          
          # If full gradle project exists, build release APK and AAB
          if [ -d "app" ]; then
            cd app && chmod +x ../gradlew 2>/dev/null || true
          fi

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sigmapro-android-package
          path: |
            *.apk
            *.aab
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
            android.keystore
          if-no-files-found: warn
